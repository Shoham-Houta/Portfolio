<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#0f0f12"/>
  <!-- Abstract interlocking geometric mark: a rotated square (diamond) overlapping a circle, minimal and sharp -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#e8e4dc" stroke-width="1.5" opacity="0.5"/>
  <rect x="9.5" y="9.5" width="13" height="13" rx="1" fill="none" stroke="#e8e4dc" stroke-width="1.5" transform="rotate(45 16 16)"/>
  <!-- Center dot as anchor -->
  <circle cx="16" cy="16" r="2" fill="#e8e4dc"/>
</svg>
