<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shoham Houta — SOC Analyst</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0A0A0F;
      --panel:    #111118;
      --border:   #1E1E2E;
      --border2:  #2A2A3E;
      --ink:      #F4F4FA;
      --ink-2:    #AAAAC8;
      --ink-3:    #6A6A88;
      --lime:     #C8FF00;
      --violet:   #7B5CFA;
      --coral:    #FF5C5C;
      --sky:      #00BFFF;
      --mono:     'Geist Mono', monospace;
      --display:  'Unbounded', sans-serif;
      --gap: clamp(3rem, 6vw, 5rem);
    }

    html { scroll-behavior: smooth; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--violet); }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 13.5px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle grid texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(123,92,250,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123,92,250,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 0 clamp(1.5rem, 5vw, 3rem);
      position: relative;
      z-index: 1;
    }

    /* ── NAV ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    nav .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }
    .nav-logo {
      font-family: var(--display);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color: var(--lime);
      text-decoration: none;
      text-shadow: 0 0 20px rgba(200,255,0,0.4);
    }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.07em;
      color: var(--ink-3);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-links a:hover { color: var(--ink); }

    /* ── HERO ── */
    header {
      padding: var(--gap) 0 calc(var(--gap) * 0.9);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    /* Big decorative background letter */
    header::after {
      content: 'SH';
      position: absolute;
      right: -1rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--display);
      font-weight: 900;
      font-size: clamp(10rem, 22vw, 18rem);
      color: transparent;
      -webkit-text-stroke: 1px rgba(123,92,250,0.08);
      pointer-events: none;
      line-height: 1;
      user-select: none;
    }

    .hero-flag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--lime);
      margin-bottom: 1.8rem;
      animation: fadeUp 0.4s ease both;
    }
    .hero-flag::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 10px var(--lime);
      animation: pulse 2.5s infinite;
      flex-shrink: 0;
    }

    h1 {
      font-family: var(--display);
      font-size: clamp(2.8rem, 7.5vw, 5.6rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-bottom: 1.2rem;
      animation: fadeUp 0.45s 0.06s ease both;
    }

    /* Highlight "Shoham" with a color underline */
    .name-first { position: relative; display: inline-block; }
    .name-first::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      bottom: 2px;
      height: 4px;
      background: linear-gradient(90deg, var(--violet), var(--sky));
      border-radius: 2px;
    }

    .hero-role-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.8rem;
      animation: fadeUp 0.45s 0.1s ease both;
    }
    .hero-role {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .hero-role-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border2), transparent);
    }

    .hero-bio {
      max-width: 540px;
      font-size: 0.83rem;
      font-weight: 300;
      color: var(--ink-2);
      line-height: 1.9;
      margin-bottom: 2rem;
      animation: fadeUp 0.45s 0.14s ease both;
    }

    .hero-contacts {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      animation: fadeUp 0.45s 0.18s ease both;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-2);
      text-decoration: none;
      border: 1px solid var(--border2);
      padding: 0.32rem 0.75rem;
      border-radius: 100px;
      background: var(--panel);
      transition: all 0.2s;
    }
    .contact-item:hover {
      color: var(--ink);
      border-color: var(--violet);
      background: rgba(123,92,250,0.1);
    }
    .contact-item svg { opacity: 0.5; flex-shrink: 0; }

    /* ── SECTIONS ── */
    section {
      padding: var(--gap) 0;
      border-bottom: 1px solid var(--border);
    }
    section:last-of-type { border-bottom: none; }

    .section-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.4rem;
    }
    .section-num {
      font-family: var(--display);
      font-size: 0.55rem;
      font-weight: 700;
      color: var(--ink-3);
    }
    .section-label {
      font-family: var(--display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    .section-rule {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── EXPERIENCE ── */
    .experience-list { display: flex; flex-direction: column; gap: 0; }

    .exp-item {
      display: grid;
      grid-template-columns: 155px 1fr;
      gap: 0 2.5rem;
      padding: 2rem 0;
      border-bottom: 1px solid var(--border);
    }
    .exp-item:last-child { border-bottom: none; padding-bottom: 0; }

    .exp-period {
      font-family: var(--mono);
      font-size: 0.67rem;
      color: var(--ink-3);
      line-height: 1.6;
      padding-top: 3px;
    }
    .exp-company {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--violet);
      margin-top: 0.3rem;
    }
    .exp-role {
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 0.75rem;
    }
    .exp-bullets { list-style: none; display: flex; flex-direction: column; gap: 0.45rem; }
    .exp-bullets li {
      font-size: 0.81rem;
      color: var(--ink-2);
      font-weight: 300;
      padding-left: 1.1rem;
      position: relative;
      line-height: 1.7;
    }
    .exp-bullets li::before { content: '›'; position: absolute; left: 0; color: var(--violet); }

    /* ── SKILLS ── */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .skill-cell {
      background: var(--panel);
      padding: 1.3rem 1.4rem;
      transition: background 0.15s;
    }
    .skill-cell:hover { background: rgba(123,92,250,0.07); }

    /* Each category gets a color accent */
    .skill-cell:nth-child(1) .skill-category { color: var(--coral); }
    .skill-cell:nth-child(2) .skill-category { color: var(--sky); }
    .skill-cell:nth-child(3) .skill-category { color: var(--lime); }
    .skill-cell:nth-child(4) .skill-category { color: var(--violet); }
    .skill-cell:nth-child(5) .skill-category { color: var(--coral); }
    .skill-cell:nth-child(6) .skill-category { color: var(--sky); }

    .skill-category {
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .skill-items { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .skill-tag {
      font-family: var(--mono);
      font-size: 0.68rem;
      background: var(--bg);
      color: var(--ink-2);
      padding: 0.18rem 0.55rem;
      border: 1px solid var(--border2);
      border-radius: 2px;
      transition: color 0.15s, border-color 0.15s;
    }
    .skill-tag:hover { color: var(--ink); border-color: var(--ink-3); }

    .bullet-link {
      color: var(--sky);
      text-decoration: none;
      border-bottom: 1px solid rgba(0,191,255,0.3);
      transition: color 0.15s, border-color 0.15s;
    }
    .bullet-link:hover { color: var(--ink); border-color: var(--ink-2); }

    /* ── EDUCATION ── */
    .edu-list { display: flex; flex-direction: column; gap: 0; }
    .edu-item {
      display: grid;
      grid-template-columns: 155px 1fr;
      gap: 0 2.5rem;
      align-items: start;
      padding: 1.6rem 0;
      border-bottom: 1px solid var(--border);
    }
    .edu-item:last-child { border-bottom: none; padding-bottom: 0; }
    .edu-period {
      font-family: var(--mono);
      font-size: 0.67rem;
      color: var(--ink-3);
      padding-top: 2px;
    }
    .edu-title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 0.35rem;
    }
    .edu-desc {
      font-size: 0.79rem;
      font-weight: 300;
      color: var(--ink-2);
      line-height: 1.75;
    }
    .cert-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.6rem;
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      color: var(--lime);
      background: rgba(200,255,0,0.07);
      border: 1px solid rgba(200,255,0,0.25);
      padding: 0.22rem 0.65rem;
      border-radius: 2px;
    }

    /* ── MILITARY ── */
    .military-card {
      border: 1px solid var(--border2);
      border-radius: 4px;
      padding: 1.8rem 2rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      align-items: start;
      background: var(--panel);
      position: relative;
      overflow: hidden;
    }
    .military-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: linear-gradient(180deg, var(--coral), var(--violet));
    }
    .mil-role {
      font-family: var(--display);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }
    .mil-desc {
      font-size: 0.8rem;
      font-weight: 300;
      color: var(--ink-2);
      max-width: 380px;
      line-height: 1.75;
    }
    .mil-meta { text-align: right; }
    .mil-period {
      font-family: var(--mono);
      font-size: 0.67rem;
      color: var(--ink-3);
      display: block;
      margin-bottom: 0.4rem;
    }
    .mil-branch {
      font-family: var(--display);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--coral);
      display: block;
      letter-spacing: 0.06em;
    }

    /* ── FOOTER ── */
    footer { padding: 2.5rem 0; }
    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .footer-name {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--ink-3);
    }
    .footer-links { display: flex; gap: 1.5rem; }
    .footer-links a {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--ink-2);
      text-decoration: none;
      transition: color 0.15s;
    }
    .footer-links a:hover { color: var(--lime); }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .reveal.visible { opacity: 1; transform: none; }

    /* ── HAMBURGER ── */
    .nav-toggle {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 28px;
      height: 28px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 200;
    }
    .nav-toggle span {
      display: block;
      width: 100%;
      height: 1.5px;
      background: var(--ink-2);
      border-radius: 2px;
      transition: all 0.25s ease;
      transform-origin: center;
    }
    .nav-toggle.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .exp-item, .edu-item { grid-template-columns: 1fr; gap: 0.4rem; }
      .military-card { grid-template-columns: 1fr; }
      .mil-meta { text-align: left; }
      .skills-grid { grid-template-columns: repeat(2, 1fr); }
      header::after { display: none; }

      .nav-toggle { display: flex; }

      .nav-links {
        display: none;
        flex-direction: column;
        position: fixed;
        top: 52px;
        left: 0; right: 0;
        background: #0A0A0F;
        border-bottom: 1px solid var(--border);
        padding: 1.2rem clamp(1.5rem, 5vw, 3rem);
        gap: 1.2rem;
        z-index: 99;
      }
      .nav-links.open { display: flex; }
      .nav-links a { font-size: 0.82rem; color: var(--ink-2); }
    }
    @media (max-width: 380px) {
      .skills-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<nav>

  linkedin: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>`,
  location: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  check:    `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,
};

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function sectionHeader(label, num) {
  return `<div class="section-header">
    <div class="section-num">${num}</div>
    <div class="section-label">${label}</div>
    <div class="section-rule"></div>
  </div>`;
}

function renderNav() {
  const nav = document.getElementById('nav-links');
  ['experience','skills','projects','education','military'].forEach(id => {
    const li = el('li');
    const a  = el('a', '', id.charAt(0).toUpperCase() + id.slice(1));
    a.href = '#' + id;
    li.appendChild(a);
    nav.appendChild(li);
  });
}

function renderHero() {
  const { label, name, title, bio, contacts } = DATA.hero;
  document.getElementById('hero-label').textContent = label;

  // Split name for underline on first name
  const [first, ...rest] = name.split(' ');
  document.getElementById('hero-name').innerHTML =
    `<span class="name-first">${first}</span> ${rest.join(' ')}`;

  document.getElementById('hero-role').textContent = title;
  document.getElementById('hero-bio').textContent = bio;

  const wrap = document.getElementById('hero-contacts');
  contacts.forEach(c => {
    const tag  = c.href ? 'a' : 'span';
    const item = el(tag, 'contact-item', ICONS[c.type] + c.label);
    if (c.href) { item.href = c.href; if (c.type === 'linkedin') item.target = '_blank'; }
    wrap.appendChild(item);
  });
}

function renderExperience(container) {
  const sec = el('section', 'reveal'); sec.id = 'experience';
  sec.innerHTML = `<div class="wrap">${sectionHeader('Work Experience','01')}<div class="experience-list" id="exp-list"></div></div>`;
  container.appendChild(sec);
  const list = sec.querySelector('#exp-list');
  DATA.experience.forEach(job => {
    const item = el('div', 'exp-item');
    item.innerHTML = `
      <div>
        <div class="exp-period">${job.period.replace('–','<br>')}</div>
        <div class="exp-company">${job.company}</div>
      </div>
      <div>
        <div class="exp-role">${job.role}</div>
        <ul class="exp-bullets">${job.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
      </div>`;
    list.appendChild(item);
  });
}

function renderSkills(container) {
  const sec = el('section', 'reveal'); sec.id = 'skills';
  sec.innerHTML = `<div class="wrap">${sectionHeader('Skills','02')}<div class="skills-grid"></div></div>`;
  container.appendChild(sec);
  const grid = sec.querySelector('.skills-grid');
  DATA.skills.forEach(group => {
    const cell = el('div', 'skill-cell');
    cell.innerHTML = `<div class="skill-category">${group.category}</div><div class="skill-items">${group.tags.map(t=>`<span class="skill-tag">${t}</span>`).join('')}</div>`;
    grid.appendChild(cell);
  });
}

function renderProjects(container) {
  const sec = el('section', 'reveal'); sec.id = 'projects';
  sec.innerHTML = `<div class="wrap">${sectionHeader('Projects','03')}<div class="experience-list" id="proj-list"></div></div>`;
  container.appendChild(sec);
  const list = sec.querySelector('#proj-list');
  DATA.projects.forEach(p => {
    const item = el('div', 'exp-item');
    item.innerHTML = `
      <div>
        <div class="exp-period">${p.period}</div>
        <div class="exp-company">${p.tag}</div>
      </div>
      <div>
        <div class="exp-role">${p.role}</div>
        <ul class="exp-bullets">${p.bullets.map(b =>
          typeof b === 'string'
            ? `<li>${b}</li>`
            : `<li><a href="${b.link}" target="_blank" class="bullet-link">${b.text} ↗</a></li>`
        ).join('')}</ul>
      </div>`;
    list.appendChild(item);
  });
}

function renderEducation(container) {
  const sec = el('section', 'reveal'); sec.id = 'education';
  sec.innerHTML = `<div class="wrap">${sectionHeader('Education & Certifications','04')}<div class="edu-list"></div></div>`;
  container.appendChild(sec);
  const list = sec.querySelector('.edu-list');
  DATA.education.forEach(e => {
    const badge = e.cert ? `<div class="cert-badge">${ICONS.check} ${e.cert.label} · ${e.cert.id}</div>` : '';
    const item = el('div', 'edu-item');
    item.innerHTML = `
      <div class="edu-period">${e.period}</div>
      <div>
        <div class="edu-title">${e.title}</div>
        <div class="edu-desc">${e.desc}</div>
        ${badge}
      </div>`;
    list.appendChild(item);
  });
}

function renderMilitary(container) {
  const m = DATA.military;
  const sec = el('section', 'reveal'); sec.id = 'military';
  sec.innerHTML = `
    <div class="wrap">
      ${sectionHeader('Military Service','05')}
      <div class="military-card">
        <div>
          <div class="mil-role">${m.role}</div>
          <div class="mil-desc">${m.desc}</div>
        </div>
        <div class="mil-meta">
          <span class="mil-period">${m.period}</span>
          <span class="mil-branch">${m.branch}</span>
        </div>
      </div>
    </div>`;
  container.appendChild(sec);
}

function renderFooter() {
  document.getElementById('footer-name').textContent = DATA.footer.name;
  const links = document.getElementById('footer-links');
  DATA.footer.links.forEach(l => {
    const a = el('a','',l.label);
    a.href = l.href;
    if (l.href.startsWith('http')) a.target = '_blank';
    links.appendChild(a);
  });
}

function initReveal() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.06 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
}

// Hamburger toggle
const toggle = document.getElementById('nav-toggle');
const navLinks = document.getElementById('nav-links');
toggle.addEventListener('click', () => {
  toggle.classList.toggle('open');
  navLinks.classList.toggle('open');
});
navLinks.addEventListener('click', e => {
  if (e.target.tagName === 'A') {
    toggle.classList.remove('open');
    navLinks.classList.remove('open');
  }
});

const main = document.getElementById('main-content');
renderNav(); renderHero();
renderExperience(main); renderSkills(main); renderProjects(main);
renderEducation(main); renderMilitary(main); renderFooter();
initReveal();
</script>
</body>
</html>
