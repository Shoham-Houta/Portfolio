<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0A0A0F;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
  }
  h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 112px;
    line-height: 1.02;
    letter-spacing: -0.035em;
    color: #F4F4FA;
    margin-bottom: 34px;
  }
  p {
    font-family: 'Geist Mono', monospace;
    font-weight: 500;
    font-size: 34px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #B6B6D2;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <h1>Shoham&nbsp;Houta</h1>
  <p>SOC Analyst</p>
</body>
</html>
